publishdir = "public"
static = "/static"
builddrafts = false
# Replace this with your website URL
baseurl = "https://s-t-a-i.github.io/"
canonifyurls = true
title = "Scalable Trustworthy AI"
math = true
copyright = "&copy; Seong Joon Oh, 2026"


[taxonomies]
category = "categories"
tag = "tags"


[params]
  # author = "Seong Joon Oh"
  email = "coallaoh@gmail.com"
  address = "Seoul AI Hub, 108 Taebong-ro, Seocho-gu, Seoul 06764, South Korea<br>서울 AI 허브, 서울특별시 서초구 태봉로 108"

  description = "Scalable Trustworthy AI (STAI) is a research group at KAIST AI led by Seong Joon Oh, working on Knowledge-Intelligence Separation: retrieval and RAG, memory-augmented architectures, agentic AI, training data attribution, privacy, and data ownership."
  slogan = "Scalable Trustworthy AI"
  slogan_text = "Creating scalable and trustworthy AI with human guidance"
  members_api_url = "https://internal.stai-lab.org/api/public/members.json"
  publications_api_url = "https://internal.stai-lab.org/api/public/publications.json"

  [params.logo]
    image = "img/stai-logos-bright.png"
    image_dark = "img/stai-logos-dark.png"
    link = "/"

  [params.publications_selected]
    detailed_list = true
    title = "Selected Publications"
    subtitle = ""

  [params.publications]
    count = 100
    detailed_list = true
    title = "Publications"
    subtitle = ""
    str_all = "More Publications"

  [params.openings]
    count = 10
    detailed_list = true
    title = "Openings"
    subtitle = ""
    str_all = "More Openings"

  [params.courses]
    count = 10
    detailed_list = true
    title = "Courses"
    subtitle = ""
    str_all = "More Courses"

  # Section will only be displayed if there are posts in `content/post/`.
  [params.posts]
    count = 2
    title = "Blog"
    subtitle = ""
    str_all = "More Posts"
    str_read_more = "Read more"

  [params.contact]
    enable = true
    title = "Contact"
    subtitle = ""
    autolink = false  # Automatically link email and phone?

  # One page per entry. Publications, Courses and Openings are the list pages
  # of their content sections, so their URLs stay singular to match the detail
  # pages that live underneath them (/publication/<slug>/ etc.).
  [[menu.main]]
      name = "Home"
      url = "/"
      weight = 1

  [[menu.main]]
      name = "Members"
      url = "/members/"
      weight = 2

  [[menu.main]]
      name = "Activities"
      url = "/activities/"
      weight = 3

  [[menu.main]]
      name = "Publications"
      url = "/publication/"
      weight = 4

  [[menu.main]]
      name = "Courses"
      url = "/courses/"
      weight = 5

  [[menu.main]]
      name = "Openings"
      url = "/opening/"
      weight = 6

  [[menu.main]]
      name = "Contact"
      url = "/contact/"
      weight = 7

# Allow raw HTML in markdown (for custom table styling)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
