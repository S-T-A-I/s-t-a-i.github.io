{{- $members := partialCached "data/members.html" . "members" -}}
{{- $alumni := where $members "isAlumni" true -}}

{{ if $alumni }}
<section class="blk" id="alumni">
  <div class="shell">
    <div class="hd">
      <div>
        <h2>Alumni</h2>
      </div>
    </div>
    <div class="people">
      {{ range $alumni }}{{ partial "person.html" (dict "m" .) }}{{ end }}
    </div>
  </div>
</section>
{{ end }}
