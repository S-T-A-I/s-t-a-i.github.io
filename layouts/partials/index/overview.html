<section class="blk home-life" aria-label="Lab life and openings">
  <div class="shell">
    <section class="home-people" aria-labelledby="home-people-title">
      <figure>
        <img src="/img/activity/2026-05-12-hiking-cheonggyesan.jpg" alt="STAI lab members on a hike at Cheonggyesan Mountain" width="5712" height="4284" loading="lazy" decoding="async">
        <figcaption>Away from our desks. Cheonggyesan, May 2026.</figcaption>
      </figure>
      <div>
        <h2 id="home-people-title">People</h2>
        <p>Meet the team and their research, and see what we do beyond the lab.</p>
        <div class="home-actions">
          <a class="home-text-link" href="/members/">Members <span aria-hidden="true">→</span></a>
          <a class="home-text-link" href="/activities/">Life at STAI <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>

    <div class="affils">
      <div class="lb">Affiliations</div>
      <div class="affil-row">
        <a class="stai" href="/">
          <img class="logo-lt" src="/{{ .Site.Params.logo.image }}" alt="STAI">
          {{ with .Site.Params.logo.image_dark }}<img class="logo-dk" src="/{{ . }}" alt="STAI">{{ end }}
        </a>
        <a class="kaist" href="https://gsai.kaist.ac.kr/"><img src="/img/logo_kaist.png" alt="KAIST"></a>
        <a class="tueai" href="https://tuebingen.ai/"><img src="/img/tueai_logo_black_text.svg" alt="Tübingen AI Center"></a>
        <a class="unitue" href="https://uni-tuebingen.de/"><img src="/img/logo_uni_tue.svg" alt="University of Tübingen"></a>
        <a class="imprs" href="https://imprs.is.mpg.de/"><img src="/img/imprs_is_logo.png" alt="IMPRS-IS"></a>
        <a class="ellis" href="https://ellis.eu/"><img src="/img/ellis_logo.png" alt="ELLIS"></a>
      </div>
    </div>
  </div>
</section>
