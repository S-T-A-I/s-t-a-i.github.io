<section class="blk home-fit" id="research-fit" aria-labelledby="research-fit-title">
  <div class="shell">
    <h2 id="research-fit-title">Research</h2>
    <ul class="home-areas">
      {{ range site.Data.research_focus }}
      <li>
        {{ if .figure }}<span class="home-fig" aria-hidden="true"><img class="fig-light" src="/img/research/{{ .id }}-light.svg" alt="" width="112" height="75" loading="lazy"><img class="fig-dark" src="/img/research/{{ .id }}-dark.svg" alt="" width="112" height="75" loading="lazy"></span>{{ end }}
        <div><h3>{{ .title }}</h3><p>{{ .description }}</p></div>
      </li>
      {{ end }}
    </ul>
    <p class="home-more"><a href="/overview/overview/">Our research vision <span aria-hidden="true">→</span></a></p>
  </div>
</section>
