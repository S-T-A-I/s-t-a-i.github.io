<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Bottling an agent's capabilities</title>
<desc id="desc">An LLM agent uses a fixed budget to build a reusable programme or small model, then applies it to a large workload.</desc>
<rect width="640" height="360" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#18324c">
<text x="320" y="44" font-size="25" font-weight="bold">Build once. Reuse across the workload.</text>
<rect x="35" y="90" width="160" height="85" rx="12" fill="#dce8fa"/>
<text x="115" y="126" font-size="22">LLM agent</text><text x="115" y="154" font-size="16">Fixed budget</text>
<path d="M205 132H250" stroke="#53769a" stroke-width="4"/><path d="m239 123 12 9-12 9" fill="none" stroke="#53769a" stroke-width="4"/>
<rect x="263" y="90" width="340" height="85" rx="12" fill="#dceedd"/>
<text x="433" y="126" font-size="22">Reusable solution</text><text x="433" y="154" font-size="17">Programme or small model</text>
<path d="M433 186V221" stroke="#53769a" stroke-width="4"/><path d="m424 210 9 12 9-12" fill="none" stroke="#53769a" stroke-width="4"/>
<rect x="263" y="233" width="340" height="70" rx="12" fill="#e8e0f5"/>
<text x="433" y="262" font-size="22">Millions of related tasks</text><text x="433" y="286" font-size="16">Balance answer quality and cost</text>
<text x="115" y="257" font-size="20" font-weight="bold">BOTTLED</text><text x="115" y="284" font-size="16">tests this ability</text>
</g></svg>